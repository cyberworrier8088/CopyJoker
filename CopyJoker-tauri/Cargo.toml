[package]
name = "CopyJoker"
version = "0.1.0"
description = "Barcode and QR scanner and generator"
authors = ["imu"]
license = "MIT"
repository = "https://github.com/cyberworrier8088/CopyJoker"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "copyjoker_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tauri = { version = "2.11.3", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
