<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CopyJoker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="hero">
            <div class="logo">CJ</div>

            <div>
                <h1>CopyJoker</h1>

                <p>
                    Generate and scan QR codes instantly.
                </p>
            </div>
        </header>


        <!-- QR GENERATOR -->
         <div class="workspace">
        <section class="workspace">

            <div class="workspace-header">
                <span class="icon">✦</span>

                <div>
                    <h2>Generate QR</h2>

                    <p>Create a QR code from text or a URL.</p>
                </div>
            </div>


            <textarea
                id="input"
                rows="4"
                placeholder="Enter text or a URL..."
            ></textarea>


            <div class="actions">

                <button id="generate" class="button primary">
                    Generate QR
                </button>

                <button
                    id="download"
                    class="button"
                    disabled
                >
                    Download SVG
                </button>

            </div>


            <p id="error" class="error"></p>


            <div id="output" class="preview">

                <div class="empty-state">
                    Your generated QR code will appear here.
                </div>

            </div>

        </section>


        <!-- QR SCANNER -->

        <section class="workspace scanner-workspace">

            <div class="workspace-header">
                <span class="icon">⌁</span>

                <div>
                    <h2>Scan QR</h2>

                    <p>
                        Upload a PNG, JPG, or SVG QR code.
                    </p>
                </div>
            </div>

            <div class="camera-actions">

                <button id="start-camera" class="button primary">
                    Start Camera
                </button>

                <button id="stop-camera" class="button" disabled>Stop Camera</button>
            </div>

            <div id="camera-container" class="camera-contaner" hidden>
                <video id="camera" autoplay playsinline></video>
            </div>

            <label for="file" class="file-picker">

                <div class="upload-icon">↑</div>

                <strong>Choose an image</strong>

                <span>
                    PNG, JPG, JPEG or SVG
                </span>

            </label>


            <input
                type="file"
                id="file"
                accept="image/png,image/jpeg,image/svg+xml,.svg"
                hidden
            >


            <div class="result">

                <span class="result-header">
                    SCAN RESULT
                </span>

                <p id="scan-result">
                    No QR code scanned yet.
                </p>

                <div class="result-actions">
                    <button id="copy-result" class="button" disabled>
                        Copy Result
                    </button>
                </div>

            </div>

        </section>

        </div>


        <footer>
            <span>CopyJoker</span>

            <span class="dot"></span>

            <span>Built with Rust + Tauri</span>
        </footer>

    </main>


    <script src="main.js"></script>

</body>
</html>
