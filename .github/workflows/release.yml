name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Check release version and notes
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag against Cargo.toml and tauri.conf.json
        working-directory: CopyJoker-tauri
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAURI_VERSION=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')

          if [ "$TAG" != "$CARGO_VERSION" ] || [ "$TAG" != "$TAURI_VERSION" ]; then
            echo "::error::Tag is v$TAG, Cargo.toml is $CARGO_VERSION, and tauri.conf.json is $TAURI_VERSION."
            exit 1
          fi

          echo "Release version $TAG matches Cargo.toml and tauri.conf.json."

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          {
            echo "notes<<END_OF_NOTES"
            git log "${PREV:+$PREV..}${GITHUB_REF_NAME}" --pretty='- %s' \
              | grep -E '^- (feat|fix|refactor|docs|chore)' \
              || echo "- Improvements and fixes"
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Build Desktop (${{ matrix.os }})
    needs:
      - ci
      - check-version

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CopyJoker-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CopyJoker-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: CopyJoker-tauri
          tauriScript: cargo tauri
          uploadWorkflowArtifacts: true

  android:
    name: Build Android APK
    needs:
      - ci
      - check-version

    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: CopyJoker-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CopyJoker-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project when it is not committed
        run: |
          if [ ! -d "gen/android" ]; then
            cargo tauri android init --ci --skip-targets-install
          fi

      - name: Build Android APK
        run: cargo tauri android build --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyJoker-Android-${{ github.ref_name }}
          path: CopyJoker-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Publish verified release assets
    needs:
      - check-version
      - desktop
      - android
    runs-on: ubuntu-24.04

    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Verify and name release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          copy_one() {
            local pattern="$1"
            local destination="$2"
            mapfile -d '' matches < <(find release-downloads -type f -iname "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $pattern package, found ${#matches[@]}."
              find release-downloads -type f -print
              exit 1
            fi
            cp "${matches[0]}" "release-assets/$destination"
          }

          copy_one '*-setup.exe' 'CopyJoker_x64-setup.exe'
          copy_one '*.msi' 'CopyJoker_x64.msi'
          copy_one '*.AppImage' 'CopyJoker.AppImage'
          copy_one '*.deb' 'CopyJoker.deb'
          copy_one '*.dmg' 'CopyJoker.dmg'
          copy_one '*.apk' 'CopyJoker.apk'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: CopyJoker ${{ github.ref_name }}
          body: |
            ## What's new

            ${{ needs.check-version.outputs.notes }}

            ## Downloads

            - Windows: `CopyJoker_x64-setup.exe`, `CopyJoker_x64.msi`
            - Linux: `CopyJoker.AppImage`, `CopyJoker.deb`
            - macOS: `CopyJoker.dmg`
            - Android: `CopyJoker.apk` (arm64)
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
